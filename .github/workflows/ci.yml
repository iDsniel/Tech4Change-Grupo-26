name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Runtime telemetry smoke test
        run: |
          npm run start > /tmp/tech4change-app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/telemetry -o /tmp/telemetry.json; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('/tmp/telemetry.json')) throw new Error('Telemetry endpoint did not become available');
          const payload = JSON.parse(fs.readFileSync('/tmp/telemetry.json', 'utf8'));
          if (payload.source?.type !== 'normalized-csv') throw new Error('Demo is not using the normalized CSV adapter');
          if (payload.source?.ingestion?.schemaVersion !== 'telemetry-shift-v1') throw new Error('Unexpected telemetry schema version');
          if (payload.source?.ingestion?.rows !== 720) throw new Error(`Expected 720 CSV rows; received ${payload.source?.ingestion?.rows}`);
          if (payload.source?.ingestion?.assets !== 8) throw new Error('Expected 8 assets in demo CSV');
          if (!payload.analysis?.statistical) throw new Error('Missing statistical analysis metadata');
          if (!payload.analysis?.multivariate) throw new Error('Missing Isolation Forest metadata');
          if (!Array.isArray(payload.insights) || payload.insights.length < 5) throw new Error('Expected demo insights were not produced');
          const applicable = payload.insights.filter((insight) => insight.multivariate?.applicable);
          if (applicable.length < 4) throw new Error('Expected multivariate analysis for non-maintenance insights');
          if (!applicable.every((insight) => typeof insight.multivariate.peakPercentile === 'number')) throw new Error('Missing multivariate percentile evidence');
          console.log(JSON.stringify({
            source: payload.source.type,
            rows: payload.source.ingestion.rows,
            insights: payload.insights.length,
            strong: payload.analysis.multivariate.strongAgreements,
            moderate: payload.analysis.multivariate.moderateAgreements,
            weak: payload.analysis.multivariate.weakAgreements
          }));
          NODE

          curl -fsS \
            -H 'Content-Type: text/csv' \
            --data-binary @data/telemetry-demo.csv \
            http://127.0.0.1:3000/api/telemetry \
            -o /tmp/external-telemetry.json

          node <<'NODE'
          const payload = require('/tmp/external-telemetry.json');
          if (payload.mode !== 'external') throw new Error('POST did not use external ingestion mode');
          if (payload.source?.ingestion?.rows !== 720) throw new Error('POST adapter changed record count');
          if (payload.insights?.length < 5) throw new Error('POST adapter did not feed the anomaly engine');
          NODE

          printf 'wrong,header\n1,2\n' > /tmp/invalid-telemetry.csv
          STATUS=$(curl -sS -o /tmp/invalid-response.json -w '%{http_code}' \
            -H 'Content-Type: text/csv' \
            --data-binary @/tmp/invalid-telemetry.csv \
            http://127.0.0.1:3000/api/telemetry)
          test "$STATUS" = "422"
          node <<'NODE'
          const payload = require('/tmp/invalid-response.json');
          if (payload.error !== 'telemetry_csv_validation_failed') throw new Error('Invalid CSV did not return contract validation error');
          NODE
