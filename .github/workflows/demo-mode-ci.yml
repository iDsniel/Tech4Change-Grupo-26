name: Demo Mode CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  demo-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Demo mode smoke test
        run: |
          grep -q 'Iniciar demonstração' components/DemoMode.tsx
          grep -q 'KLT-03' components/DemoMode.tsx
          grep -q 'KLT-04' components/DemoMode.tsx
          grep -q 'KLT-05' components/DemoMode.tsx
          grep -q 'POTENCIALIZE COM O PULSO' components/KoneDemoDashboard.tsx
          grep -q '2 t por fardo' components/KoneDemoDashboard.tsx
          grep -q 'demoFocus' app/demo-mode.css
          grep -q 'DemoMode' app/layout.tsx

          node --experimental-strip-types --test tests/kone-demo.test.ts
